<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير المهام الذكي - Smart Task Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        /* Drag & Drop Visual Styles */
        .task-card.dragging {
            opacity: 0.4;
            transform: scale(0.98) rotate(2deg);
            cursor: grabbing;
        }

        .kanban-column.drag-over {
            background-color: rgba(59, 130, 246, 0.08);
            border: 2px dashed #3b82f6;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Modal Animation */
        .modal-backdrop {
            transition: opacity 0.3s ease;
        }
        .modal-content {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- Navbar / Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid font-bold fa-kanban text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">مدير المهام الذكي</h1>
                    <p class="text-xs font-semibold text-slate-500">منظومة إنجاز الأعمال المرنة</p>
                </div>
            </div>

            <!-- Header Action & Stats -->
            <div class="flex items-center gap-3 sm:gap-4">
                <button id="openAddTaskBtn" onclick="openTaskModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-blue-500/25 transition-all text-sm">
                    <i class="fa-solid fa-plus text-base"></i>
                    <span class="hidden sm:inline">إضافة مهمة جديدة</span>
                    <span class="sm:hidden">إضافة</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 flex flex-col gap-6">

        <!-- Controls Section: Search & Filters & Stats Progress -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
            <!-- Search & Filters -->
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full lg:w-auto">
                <!-- Search Input -->
                <div class="relative w-full sm:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="البحث عن مهمة..." class="w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                </div>
                <!-- Priority Filter -->
                <div class="w-full sm:w-48">
                    <select id="priorityFilter" onchange="applyFilters()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-700">
                        <option value="all">كل الأولويات</option>
                        <option value="high">مرتفعة 🔥</option>
                        <option value="medium">متوسطة ⚡</option>
                        <option value="low">منخفضة ☕</option>
                    </select>
                </div>
            </div>

            <!-- Overall Progress bar -->
            <div class="flex items-center gap-4 w-full lg:w-80 bg-slate-50 p-3 rounded-xl border border-slate-100">
                <div class="flex-1">
                    <div class="flex justify-between items-center mb-1 text-xs font-bold text-slate-600">
                        <span>نسبة الإنجاز الكلية</span>
                        <span id="progressPercentage">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                        <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="text-slate-400 text-xs text-left border-r border-slate-200 pr-3 font-semibold">
                    <div>إجمالي: <span id="totalTasksCount" class="text-slate-700 font-bold">0</span></div>
                </div>
            </div>
        </section>

        <!-- Kanban Board Columns -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start flex-1">
            
            <!-- Column 1: To Do -->
            <div class="kanban-column bg-slate-100/70 border border-slate-200/80 rounded-2xl p-4 flex flex-col min-h-[500px] transition-colors" data-status="todo" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200/80">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-slate-400"></span>
                        <h2 class="font-bold text-slate-700">المهام القادمة</h2>
                        <span id="count-todo" class="bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                    </div>
                    <button onclick="openTaskModal('todo')" class="text-slate-400 hover:text-blue-600 transition-colors p-1" title="إضافة مهمة">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <!-- Container for cards -->
                <div id="todo-list" class="task-list flex-1 flex flex-col gap-3 min-h-[400px]"></div>
            </div>

            <!-- Column 2: In Progress -->
            <div class="kanban-column bg-slate-100/70 border border-slate-200/80 rounded-2xl p-4 flex flex-col min-h-[500px] transition-colors" data-status="in-progress" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200/80">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                        <h2 class="font-bold text-slate-700">قيد التنفيذ</h2>
                        <span id="count-in-progress" class="bg-amber-100 text-amber-700 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                    </div>
                    <button onclick="openTaskModal('in-progress')" class="text-slate-400 hover:text-amber-600 transition-colors p-1" title="إضافة مهمة">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <!-- Container for cards -->
                <div id="in-progress-list" class="task-list flex-1 flex flex-col gap-3 min-h-[400px]"></div>
            </div>

            <!-- Column 3: Done -->
            <div class="kanban-column bg-slate-100/70 border border-slate-200/80 rounded-2xl p-4 flex flex-col min-h-[500px] transition-colors" data-status="done" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200/80">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <h2 class="font-bold text-slate-700">المكتملة</h2>
                        <span id="count-done" class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                    </div>
                    <button onclick="openTaskModal('done')" class="text-slate-400 hover:text-emerald-600 transition-colors p-1" title="إضافة مهمة">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <!-- Container for cards -->
                <div id="done-list" class="task-list flex-1 flex flex-col gap-3 min-h-[400px]"></div>
            </div>

        </section>
    </main>

    <!-- Task Add/Edit Modal -->
    <div id="taskModal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <!-- Backdrop -->
        <div class="modal-backdrop fixed inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeTaskModal()"></div>

        <!-- Modal Box -->
        <div class="modal-content relative bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-lg mx-4 p-6 overflow-hidden z-10 transform scale-95 transition-transform duration-300">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">إضافة مهمة جديدة</h3>
                <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="taskForm" onsubmit="handleTaskSubmit(event)" class="space-y-4">
                <input type="hidden" id="taskId">
                
                <!-- Title -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">عنوان المهمة <span class="text-red-500">*</span></label>
                    <input type="text" id="taskTitle" required placeholder="مثال: تصميم الواجهة الرئيسية" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">الوصف التفصيلي</label>
                    <textarea id="taskDesc" rows="3" placeholder="أضف تفاصيل مخصصة للمهمة هنا..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Priority -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">الأولوية</label>
                        <select id="taskPriority" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                            <option value="low">منخفضة</option>
                            <option value="medium" selected>متوسطة</option>
                            <option value="high">مرتفعة</option>
                        </select>
                    </div>

                    <!-- Due Date -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">تاريخ الاستحقاق</label>
                        <input type="date" id="taskDueDate" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    </div>
                </div>

                <!-- Status Select -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">الحالة</label>
                    <select id="taskStatus" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                        <option value="todo">المهام القادمة (To Do)</option>
                        <option value="in-progress">قيد التنفيذ (In Progress)</option>
                        <option value="done">مكتملة (Done)</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50 transition-colors">إلغاء</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-md shadow-blue-500/20 transition-all">حفظ المهمة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-5 z-50 flex items-center gap-3 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-check-circle text-emerald-400"></i>
        <span id="toastMessage" class="text-sm font-medium">تمت العملية بنجاح</span>
    </div>

    <!-- Application Script -->
    <script>
        // State Management
        let tasks = [];
        let draggedTaskId = null;

        // Priority Mappings
        const priorityConfig = {
            high: { label: 'مرتفعة', bg: 'bg-rose-50', text: 'text-rose-600', border: 'border-rose-200', icon: '🔥' },
            medium: { label: 'متوسطة', bg: 'bg-amber-50', text: 'text-amber-600', border: 'border-amber-200', icon: '⚡' },
            low: { label: 'منخفضة', bg: 'bg-slate-50', text: 'text-slate-600', border: 'border-slate-200', icon: '☕' }
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            renderBoard();
        });

        // Load tasks from LocalStorage
        function loadTasks() {
            const stored = localStorage.getItem('smart_kanban_tasks');
            if (stored) {
                try {
                    tasks = JSON.parse(stored);
                } catch (e) {
                    console.error('Failed to parse tasks', e);
                    tasks = getSampleTasks();
                }
            } else {
                tasks = getSampleTasks();
                saveTasks();
            }
        }

        // Save tasks to LocalStorage
        function saveTasks() {
            localStorage.setItem('smart_kanban_tasks', JSON.stringify(tasks));
        }

        // Default sample data for first launch
        function getSampleTasks() {
            return [
                {
                    id: '1',
                    title: 'تخطيط ميزانية المشروع',
                    description: 'إعداد جدول البيانات المالي لجميع مستلزمات الربع القادم.',
                    priority: 'high',
                    dueDate: '2026-11-20',
                    status: 'todo',
                    createdAt: new Date().toISOString()
                },
                {
                    id: '2',
                    title: 'تحديث مراجعات التصميم',
                    description: 'تطبيق التعديلات الواردة من الفريق الفني على بطاقات التطبيق.',
                    priority: 'medium',
                    dueDate: '2026-11-15',
                    status: 'in-progress',
                    createdAt: new Date().toISOString()
                },
                {
                    id: '3',
                    title: 'إطلاق النسخة التجريبية',
                    description: 'فحص كل وظائف النظام قبل النشر على الخادم المباشر.',
                    priority: 'low',
                    dueDate: '2026-11-10',
                    status: 'done',
                    createdAt: new Date().toISOString()
                }
            ];
        }

        // Render the board with applied filters
        function renderBoard() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const priorityVal = document.getElementById('priorityFilter').value;

            // Filter tasks
            const filteredTasks = tasks.filter(task => {
                const matchesSearch = task.title.toLowerCase().includes(searchVal) || 
                                     (task.description && task.description.toLowerCase().includes(searchVal));
                const matchesPriority = priorityVal === 'all' || task.priority === priorityVal;
                return matchesSearch && matchesPriority;
            });

            // Columns containers
            const todoList = document.getElementById('todo-list');
            const inProgressList = document.getElementById('in-progress-list');
            const doneList = document.getElementById('done-list');

            todoList.innerHTML = '';
            inProgressList.innerHTML = '';
            doneList.innerHTML = '';

            let counts = { todo: 0, 'in-progress': 0, done: 0 };

            filteredTasks.forEach(task => {
                counts[task.status]++;
                const card = createTaskCardHTML(task);

                if (task.status === 'todo') todoList.appendChild(card);
                else if (task.status === 'in-progress') inProgressList.appendChild(card);
                else if (task.status === 'done') doneList.appendChild(card);
            });

            // Render empty state if no tasks in column
            renderEmptyStates(todoList, inProgressList, doneList);

            // Update Counts and Progress Bar
            document.getElementById('count-todo').textContent = counts.todo;
            document.getElementById('count-in-progress').textContent = counts['in-progress'];
            document.getElementById('count-done').textContent = counts.done;

            updateOverallProgress();
        }

        // Render empty column placeholder
        function renderEmptyStates(todo, inProgress, done) {
            const emptyTemplate = (msg) => {
                const div = document.createElement('div');
                div.className = "flex-1 flex flex-col items-center justify-center p-6 text-center border-2 border-dashed border-slate-200 rounded-xl text-slate-400 select-none min-h-[150px]";
                div.innerHTML = `<i class="fa-regular fa-folder-open text-2xl mb-2 opacity-50"></i><span class="text-xs font-semibold">${msg}</span>`;
                return div;
            };

            if (todo.children.length === 0) todo.appendChild(emptyTemplate('لا توجد مهام قادمة'));
            if (inProgress.children.length === 0) inProgress.appendChild(emptyTemplate('لا توجد مهام قيد التنفيذ'));
            if (done.children.length === 0) done.appendChild(emptyTemplate('لا توجد مهام مكتملة'));
        }

        // Create HTML Element for Task Card
        function createTaskCardHTML(task) {
            const p = priorityConfig[task.priority] || priorityConfig.medium;
            const isDone = task.status === 'done';

            const card = document.createElement('div');
            card.className = `task-card bg-white p-4 rounded-xl shadow-sm border border-slate-200/90 hover:shadow-md transition-all cursor-grab active:cursor-grabbing relative group ${isDone ? 'opacity-85' : ''}`;
            card.setAttribute('draggable', 'true');
            card.setAttribute('data-id', task.id);

            // Drag Events
            card.addEventListener('dragstart', (e) => handleDragStart(e, task.id));
            card.addEventListener('dragend', handleDragEnd);

            // Date Formatting
            let formattedDate = '';
            if (task.dueDate) {
                const d = new Date(task.dueDate);
                formattedDate = d.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric' });
            }

            card.innerHTML = `
                <div class="flex items-start justify-between gap-2 mb-2">
                    <span class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full ${p.bg} ${p.text} border ${p.border}">
                        <span>${p.icon}</span>
                        <span>${p.label}</span>
                    </span>
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                        <button onclick="editTask('${task.id}')" class="text-slate-400 hover:text-blue-600 p-1 rounded transition-colors" title="تعديل">
                            <i class="fa-solid fa-pen-to-square text-xs"></i>
                        </button>
                        <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-600 p-1 rounded transition-colors" title="حذف">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>

                <h3 class="font-bold text-slate-800 text-sm mb-1 leading-snug ${isDone ? 'line-through text-slate-400' : ''}">${escapeHTML(task.title)}</h3>
                ${task.description ? `<p class="text-xs text-slate-500 line-clamp-2 mb-3 ${isDone ? 'line-through opacity-70' : ''}">${escapeHTML(task.description)}</p>` : ''}

                <div class="flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-100 pt-2.5 mt-2">
                    <div class="flex items-center gap-1">
                        ${task.dueDate ? `<i class="fa-regular fa-calendar"></i> <span>${formattedDate}</span>` : '<span>بدون تاريخ</span>'}
                    </div>
                    
                    <!-- Quick Toggle Button -->
                    <button onclick="toggleTaskStatus('${task.id}')" class="text-xs text-slate-500 hover:text-blue-600 transition-colors flex items-center gap-1 font-semibold" title="تغيير الحالة">
                        <i class="${isDone ? 'fa-solid fa-rotate-left text-amber-500' : 'fa-regular fa-circle-check text-emerald-500'}"></i>
                        <span>${isDone ? 'إعادة' : 'إنجاز'}</span>
                    </button>
                </div>
            `;

            return card;
        }

        // --- Drag and Drop Handlers ---
        function handleDragStart(e, id) {
            draggedTaskId = id;
            e.dataTransfer.setData('text/plain', id);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => {
                e.target.classList.add('dragging');
            }, 0);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedTaskId = null;
            document.querySelectorAll('.kanban-column').forEach(col => {
                col.classList.remove('drag-over');
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const column = e.currentTarget;
            column.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            const column = e.currentTarget;
            column.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            const column = e.currentTarget;
            column.classList.remove('drag-over');
            const targetStatus = column.getAttribute('data-status');

            if (draggedTaskId && targetStatus) {
                const taskIndex = tasks.findIndex(t => t.id === draggedTaskId);
                if (taskIndex !== -1 && tasks[taskIndex].status !== targetStatus) {
                    tasks[taskIndex].status = targetStatus;
                    saveTasks();
                    renderBoard();
                    showToast('تم تحديث حالة المهمة بنجاح');
                }
            }
        }

        // --- Modal & Form Logic ---
        function openTaskModal(defaultStatus = 'todo') {
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            document.getElementById('modalTitle').textContent = 'إضافة مهمة جديدة';
            document.getElementById('taskStatus').value = defaultStatus;
            
            const modal = document.getElementById('taskModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('.modal-content').classList.remove('scale-95');
                modal.querySelector('.modal-content').classList.add('scale-100');
            }, 10);
        }

        function closeTaskModal() {
            const modal = document.getElementById('taskModal');
            modal.querySelector('.modal-content').classList.remove('scale-100');
            modal.querySelector('.modal-content').classList.add('scale-95');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function handleTaskSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDesc').value.trim();
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDueDate').value;
            const status = document.getElementById('taskStatus').value;

            if (!title) return;

            if (id) {
                // Edit existing task
                const index = tasks.findIndex(t => t.id === id);
                if (index !== -1) {
                    tasks[index] = { ...tasks[index], title, description, priority, dueDate, status };
                    showToast('تم تعديل البيانات بنجاح');
                }
            } else {
                // Add new task
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    description,
                    priority,
                    dueDate,
                    status,
                    createdAt: new Date().toISOString()
                };
                tasks.unshift(newTask);
                showToast('تم إضافة المهمة بنجاح');
            }

            saveTasks();
            renderBoard();
            closeTaskModal();
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('taskId').value = task.id;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDesc').value = task.description || '';
            document.getElementById('taskPriority').value = task.priority;
            document.getElementById('taskDueDate').value = task.dueDate || '';
            document.getElementById('taskStatus').value = task.status;

            document.getElementById('modalTitle').textContent = 'تعديل المهمة';

            const modal = document.getElementById('taskModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('.modal-content').classList.remove('scale-95');
                modal.querySelector('.modal-content').classList.add('scale-100');
            }, 10);
        }

        function deleteTask(id) {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذه المهمة؟')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderBoard();
                showToast('تم حذف المهمة');
            }
        }

        function toggleTaskStatus(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            if (task.status === 'done') {
                task.status = 'todo';
            } else {
                task.status = 'done';
            }

            saveTasks();
            renderBoard();
            showToast('تم تغيير حالة المهمة');
        }

        // Filters Trigger
        function applyFilters() {
            renderBoard();
        }

        // Progress Calculation
        function updateOverallProgress() {
            const total = tasks.length;
            document.getElementById('totalTasksCount').textContent = total;

            if (total === 0) {
                document.getElementById('progressPercentage').textContent = '0%';
                document.getElementById('progressBar').style.width = '0%';
                return;
            }

            const doneCount = tasks.filter(t => t.status === 'done').length;
            const percentage = Math.round((doneCount / total) * 100);

            document.getElementById('progressPercentage').textContent = `${percentage}%`;
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        // Toast Notification Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // HTML Sanitizer to prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
